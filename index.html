
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CloudTask v1.1</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #d4b286, #d4b286);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: #302d29;
    }

    .app {
      width: 100%;
      max-width: 820px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #C7A175, #B27C4F);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header p {
      opacity: 0.9;
      margin-bottom: 5px;
    }

    .version {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.18);
    }

    .content {
      padding: 28px;
    }

    .input-group {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px 100px;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"],
    select {
      width: 100%;
      min-width: 0;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: white;
      color: #302d29;
    }

    button {
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #8b5e34;
      outline-offset: 2px;
    }

    #addTaskBtn {
      border: none;
      background: #C7A175;
      color: white;
      border-radius: 10px;
      font-weight: bold;
      padding: 12px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: none;
      background: #e5e7eb;
      padding: 9px 15px;
      border-radius: 20px;
      color: #302d29;
    }

    .filter-btn.active {
      background: #C7A175;
      color: white;
    }

    .clear-btn {
      border: none;
      background: #f5e5d2;
      color: #80552e;
      padding: 9px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    .task-list {
      list-style: none;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .task-left input[type="checkbox"] {
      flex-shrink: 0;
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .task-text {
      overflow-wrap: anywhere;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .priority {
      width: fit-content;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .priority-baja {
      background: #dcfce7;
      color: #166534;
    }

    .priority-media {
      background: #fef3c7;
      color: #92400e;
    }

    .priority-alta {
      background: #fee2e2;
      color: #b91c1c;
    }

    .delete-btn {
      flex-shrink: 0;
      border: none;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 8px;
      padding: 8px 12px;
    }

    .summary {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary-card {
      background: #f5e9da;
      color: #80552e;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }

    .summary-card strong {
      display: block;
      font-size: 24px;
      margin-top: 5px;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 25px;
    }

    footer {
      border-top: 1px solid #e5e7eb;
      text-align: center;
      padding: 18px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      body {
        padding: 15px;
      }

      .content {
        padding: 20px;
      }

      .input-group,
      .summary {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: flex-start;
      }

      .task {
        padding: 12px;
      }

      .header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <h1>☁ CloudTask</h1>
      <p>Gestor de tareas interactivo</p>
      <p>Desarrollado por García Veléz Kilmer Adrián</p>
      <span class="version">Versión 1.1</span>
    </div>

    <div class="content">

      <div class="input-group">
        <input
          id="taskInput"
          type="text"
          placeholder="Escribe una nueva tarea..."
          maxlength="250"
          aria-label="Nombre de la nueva tarea"
        >

        <select id="prioritySelect" aria-label="Prioridad de la tarea">
          <option value="baja">Prioridad baja</option>
          <option value="media" selected>Prioridad media</option>
          <option value="alta">Prioridad alta</option>
        </select>

        <button id="addTaskBtn">Agregar</button>
      </div>

      <div class="toolbar">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">
            Todas
          </button>

          <button class="filter-btn" data-filter="pending">
            Pendientes
          </button>

          <button class="filter-btn" data-filter="completed">
            Completadas
          </button>
        </div>

        <button id="clearCompletedBtn" class="clear-btn">
          Eliminar completadas
        </button>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <div class="summary">
        <div class="summary-card">
          Total de tareas
          <strong id="totalCount">0</strong>
        </div>

        <div class="summary-card">
          Tareas pendientes
          <strong id="pendingCount">0</strong>
        </div>
      </div>

    </div>

    <footer>
      CloudTask v1.1 · Práctica de Computación en la Nube
    </footer>

  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const prioritySelect = document.getElementById("prioritySelect");
    const addTaskBtn = document.getElementById("addTaskBtn");
    const taskList = document.getElementById("taskList");
    const pendingCount = document.getElementById("pendingCount");
    const totalCount = document.getElementById("totalCount");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const clearCompletedBtn = document.getElementById("clearCompletedBtn");

    const STORAGE_KEY = "cloudTaskTasks";
    let currentFilter = "all";

    const initialTasks = [
      {
        id: 1,
        text: "Subir proyecto a GitHub",
        completed: false,
        priority: "alta"
      },
      {
        id: 2,
        text: "Desplegar aplicación en Vercel",
        completed: false,
        priority: "media"
      },
      {
        id: 3,
        text: "Probar aplicación desde el teléfono",
        completed: true,
        priority: "baja"
      }
    ];

    function loadTasks() {
      try {
        const savedTasks = localStorage.getItem(STORAGE_KEY);

        if (savedTasks === null) {
          return initialTasks.map(task => ({ ...task }));
        }

        const parsedTasks = JSON.parse(savedTasks);

        if (
          !Array.isArray(parsedTasks) ||
          !parsedTasks.every(task =>
            task &&
            Number.isSafeInteger(task.id) &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean" &&
            ["baja", "media", "alta"].includes(task.priority)
          )
        ) {
          return initialTasks.map(task => ({ ...task }));
        }

        return parsedTasks;
      } catch (error) {
        console.error("No se pudieron cargar las tareas:", error);
        return initialTasks.map(task => ({ ...task }));
      }
    }

    let tasks = loadTasks();

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (error) {
        console.error("No se pudieron guardar las tareas:", error);
        alert("No se pudieron guardar los cambios en este navegador.");
      }
    }

    function renderTasks() {
      taskList.innerHTML = "";

      const filteredTasks = tasks.filter(task => {
        if (currentFilter === "pending") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });

      if (filteredTasks.length === 0) {
        const emptyMessage = document.createElement("li");
        emptyMessage.className = "empty";
        emptyMessage.textContent = "No hay tareas para mostrar";
        taskList.appendChild(emptyMessage);
      }

      const priorityText = {
        baja: "Baja",
        media: "Media",
        alta: "Alta"
      };

      filteredTasks.forEach(task => {
        const li = document.createElement("li");
        li.className = "task";

        if (task.completed) {
          li.classList.add("completed");
        }

        const taskLeft = document.createElement("div");
        taskLeft.className = "task-left";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute(
          "aria-label",
          "Marcar como completada: " + task.text
        );

        checkbox.addEventListener("change", () => {
          toggleTask(task.id);
        });

        const taskInfo = document.createElement("div");
        taskInfo.className = "task-info";

        const taskText = document.createElement("span");
        taskText.className = "task-text";
        taskText.textContent = task.text;

        const priority = document.createElement("span");
        priority.className = "priority priority-" + task.priority;
        priority.textContent = "Prioridad " + priorityText[task.priority];

        taskInfo.appendChild(taskText);
        taskInfo.appendChild(priority);

        taskLeft.appendChild(checkbox);
        taskLeft.appendChild(taskInfo);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Eliminar";
        deleteButton.setAttribute("aria-label", "Eliminar: " + task.text);

        deleteButton.addEventListener("click", () => {
          deleteTask(task.id);
        });

        li.appendChild(taskLeft);
        li.appendChild(deleteButton);
        taskList.appendChild(li);
      });

      updateCounters();
    }

    function addTask() {
      const text = taskInput.value.trim();

      if (text === "") {
        alert("Escribe una tarea.");
        taskInput.focus();
        return;
      }

      tasks.push({
        id: Date.now(),
        text: text,
        completed: false,
        priority: prioritySelect.value
      });

      taskInput.value = "";
      prioritySelect.value = "media";

      saveTasks();
      renderTasks();
      taskInput.focus();
    }

    function toggleTask(id) {
      tasks = tasks.map(task =>
        task.id === id
          ? { ...task, completed: !task.completed }
          : task
      );

      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);

      saveTasks();
      renderTasks();
    }

    function clearCompletedTasks() {
      if (!tasks.some(task => task.completed)) {
        alert("No hay tareas completadas.");
        return;
      }

      if (confirm("¿Eliminar todas las tareas completadas?")) {
        tasks = tasks.filter(task => !task.completed);

        saveTasks();
        renderTasks();
      }
    }

    function updateCounters() {
      totalCount.textContent = tasks.length;

      pendingCount.textContent =
        tasks.filter(task => !task.completed).length;
    }

    addTaskBtn.addEventListener("click", addTask);

    taskInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        addTask();
      }
    });

    clearCompletedBtn.addEventListener(
      "click",
      clearCompletedTasks
    );

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        filterButtons.forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");
        currentFilter = button.dataset.filter;

        renderTasks();
      });
    });

    renderTasks();
  </script>
</body>
</html>
