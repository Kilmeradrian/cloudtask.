
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTask v1.2</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #d4b286, #d4b286);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: #302d29;
    }

    .app {
      width: 100%;
      max-width: 920px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #C7A175, #B27C4F);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header p {
      margin-bottom: 6px;
      opacity: 0.9;
    }

    .version {
      display: inline-block;
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.18);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .content {
      padding: 28px;
    }

    .input-group {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px 160px 110px;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      min-width: 0;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: white;
      color: #302d29;
    }

    button {
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    #addTaskBtn {
      border: none;
      border-radius: 10px;
      background: #C7A175;
      color: white;
      font-weight: bold;
      padding: 12px;
    }

    .control-panel {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-bottom: 20px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: none;
      background: #e5e7eb;
      padding: 9px 15px;
      border-radius: 20px;
    }

    .filter-btn.active {
      background: #C7A175;
      color: white;
    }

    .clear-btn {
      border: none;
      background: #f5e5d2;
      color: #80552e;
      padding: 9px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    .task-list {
      list-style: none;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 12px;
    }

    .task.overdue {
      border-left: 5px solid #dc2626;
    }

    .task-left {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      min-width: 0;
    }

    .task-left input[type="checkbox"] {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      margin-top: 3px;
      cursor: pointer;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .task-text {
      overflow-wrap: anywhere;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
    }

    .priority,
    .date-badge,
    .overdue-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .priority-baja {
      background: #dcfce7;
      color: #166534;
    }

    .priority-media {
      background: #fef3c7;
      color: #92400e;
    }

    .priority-alta {
      background: #fee2e2;
      color: #b91c1c;
    }

    .date-badge {
      background: #f5e9da;
      color: #80552e;
    }

    .overdue-badge {
      background: #fee2e2;
      color: #b91c1c;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .edit-btn,
    .delete-btn {
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .edit-btn {
      background: #f5e9da;
      color: #80552e;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
    }

    .summary {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .summary-card {
      background: #f5e9da;
      color: #80552e;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }

    .summary-card strong {
      display: block;
      font-size: 24px;
      margin-top: 4px;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 25px;
    }

    footer {
      border-top: 1px solid #e5e7eb;
      padding: 18px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      body {
        padding: 15px;
      }

      .content {
        padding: 20px;
      }

      .input-group,
      .control-panel,
      .summary {
        grid-template-columns: 1fr;
      }

      .task {
        flex-direction: column;
        align-items: stretch;
      }

      .actions {
        justify-content: flex-end;
      }

      .header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>☁ CloudTask</h1>
    <p>Gestor de tareas interactivo</p>
    <p>Desarrollado por García Veléz Kilmer Adrián</p>
    <span class="version">Versión 1.2</span>
  </div>

  <div class="content">

    <div class="input-group">
      <input
        id="taskInput"
        type="text"
        placeholder="Escribe una nueva tarea..."
        maxlength="250"
      >

      <select id="prioritySelect">
        <option value="baja">Prioridad baja</option>
        <option value="media" selected>Prioridad media</option>
        <option value="alta">Prioridad alta</option>
      </select>

      <input
        id="dueDateInput"
        type="date"
        aria-label="Fecha límite de la tarea"
      >

      <button id="addTaskBtn">Agregar</button>
    </div>

    <div class="control-panel">
      <input
        id="searchInput"
        type="text"
        placeholder="Buscar tareas..."
      >

      <select id="sortSelect">
        <option value="default">Orden original</option>
        <option value="priority">Por prioridad</option>
        <option value="date">Por fecha límite</option>
      </select>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pending">Pendientes</button>
        <button class="filter-btn" data-filter="completed">Completadas</button>
      </div>

      <button id="clearCompletedBtn" class="clear-btn">
        Eliminar completadas
      </button>
    </div>

    <ul id="taskList" class="task-list"></ul>

    <div class="summary">
      <div class="summary-card">
        Total
        <strong id="totalCount">0</strong>
      </div>

      <div class="summary-card">
        Pendientes
        <strong id="pendingCount">0</strong>
      </div>

      <div class="summary-card">
        Vencidas
        <strong id="overdueCount">0</strong>
      </div>
    </div>

  </div>

  <footer>
    CloudTask v1.2 · GitHub + Vercel / Netlify
  </footer>

</div>

<script>
  const taskInput = document.getElementById("taskInput");
  const prioritySelect = document.getElementById("prioritySelect");
  const dueDateInput = document.getElementById("dueDateInput");
  const addTaskBtn = document.getElementById("addTaskBtn");
  const taskList = document.getElementById("taskList");

  const totalCount = document.getElementById("totalCount");
  const pendingCount = document.getElementById("pendingCount");
  const overdueCount = document.getElementById("overdueCount");

  const filterButtons = document.querySelectorAll(".filter-btn");
  const clearCompletedBtn = document.getElementById("clearCompletedBtn");
  const searchInput = document.getElementById("searchInput");
  const sortSelect = document.getElementById("sortSelect");

  const STORAGE_KEY = "cloudTaskTasks";

  let currentFilter = "all";
  let editingId = null;

  const initialTasks = [
    {
      id: 1,
      text: "Subir proyecto a GitHub",
      completed: false,
      priority: "alta",
      dueDate: ""
    },
    {
      id: 2,
      text: "Desplegar aplicación en Vercel",
      completed: false,
      priority: "media",
      dueDate: ""
    },
    {
      id: 3,
      text: "Probar aplicación desde el teléfono",
      completed: true,
      priority: "baja",
      dueDate: ""
    }
  ];

  function loadTasks() {
    try {
      const savedTasks = localStorage.getItem(STORAGE_KEY);

      if (savedTasks === null) {
        return initialTasks.map(task => ({ ...task }));
      }

      const parsedTasks = JSON.parse(savedTasks);

      if (
        !Array.isArray(parsedTasks) ||
        !parsedTasks.every(task =>
          task &&
          Number.isSafeInteger(task.id) &&
          typeof task.text === "string" &&
          typeof task.completed === "boolean" &&
          ["baja", "media", "alta"].includes(task.priority)
        )
      ) {
        return initialTasks.map(task => ({ ...task }));
      }

      return parsedTasks.map(task => ({
        ...task,
        dueDate: task.dueDate || ""
      }));
    } catch (error) {
      console.error("Error al cargar las tareas:", error);
      return initialTasks.map(task => ({ ...task }));
    }
  }

  let tasks = loadTasks();

  function saveTasks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (error) {
      console.error("Error al guardar las tareas:", error);
      alert("No se pudieron guardar los cambios en el navegador.");
    }
  }

  function isOverdue(task) {
    if (!task.dueDate || task.completed) {
      return false;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const due = new Date(task.dueDate + "T00:00:00");

    return !Number.isNaN(due.getTime()) && due < today;
  }

  function renderTasks() {
    taskList.innerHTML = "";

    let visibleTasks = [...tasks];

    if (currentFilter === "pending") {
      visibleTasks = visibleTasks.filter(task => !task.completed);
    }

    if (currentFilter === "completed") {
      visibleTasks = visibleTasks.filter(task => task.completed);
    }

    const searchText = searchInput.value.toLowerCase().trim();

    if (searchText) {
      visibleTasks = visibleTasks.filter(task =>
        task.text.toLowerCase().includes(searchText)
      );
    }

    if (sortSelect.value === "priority") {
      const order = { alta: 1, media: 2, baja: 3 };

      visibleTasks.sort(
        (a, b) => order[a.priority] - order[b.priority]
      );
    }

    if (sortSelect.value === "date") {
      visibleTasks.sort((a, b) => {
        if (!a.dueDate && !b.dueDate) return 0;
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;

        return a.dueDate.localeCompare(b.dueDate);
      });
    }

    if (visibleTasks.length === 0) {
      const emptyMessage = document.createElement("li");
      emptyMessage.className = "empty";
      emptyMessage.textContent = "No hay tareas para mostrar";
      taskList.appendChild(emptyMessage);
    }

    const priorityText = {
      baja: "Baja",
      media: "Media",
      alta: "Alta"
    };

    visibleTasks.forEach(task => {
      const li = document.createElement("li");
      li.className = "task";

      if (task.completed) {
        li.classList.add("completed");
      }

      if (isOverdue(task)) {
        li.classList.add("overdue");
      }

      const taskLeft = document.createElement("div");
      taskLeft.className = "task-left";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.completed;
      checkbox.setAttribute("aria-label", "Marcar tarea como completada");

      checkbox.addEventListener("change", () => toggleTask(task.id));

      const taskInfo = document.createElement("div");
      taskInfo.className = "task-info";

      const taskText = document.createElement("span");
      taskText.className = "task-text";
      taskText.textContent = task.text;

      const meta = document.createElement("div");
      meta.className = "meta";

      const priority = document.createElement("span");
      priority.className = "priority priority-" + task.priority;
      priority.textContent = "Prioridad " + priorityText[task.priority];
      meta.appendChild(priority);

      if (task.dueDate) {
        const dateBadge = document.createElement("span");
        dateBadge.className = "date-badge";
        dateBadge.textContent = "Fecha: " + task.dueDate;
        meta.appendChild(dateBadge);
      }

      if (isOverdue(task)) {
        const overdueBadge = document.createElement("span");
        overdueBadge.className = "overdue-badge";
        overdueBadge.textContent = "Vencida";
        meta.appendChild(overdueBadge);
      }

      taskInfo.appendChild(taskText);
      taskInfo.appendChild(meta);
      taskLeft.appendChild(checkbox);
      taskLeft.appendChild(taskInfo);

      const actions = document.createElement("div");
      actions.className = "actions";

      const editButton = document.createElement("button");
      editButton.className = "edit-btn";
      editButton.textContent = "Editar";
      editButton.addEventListener("click", () => editTask(task.id));

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-btn";
      deleteButton.textContent = "Eliminar";
      deleteButton.addEventListener("click", () => deleteTask(task.id));

      actions.appendChild(editButton);
      actions.appendChild(deleteButton);

      li.appendChild(taskLeft);
      li.appendChild(actions);
      taskList.appendChild(li);
    });

    updateCounters();
  }

  function addOrUpdateTask() {
    const text = taskInput.value.trim();

    if (!text) {
      alert("Escribe una tarea.");
      taskInput.focus();
      return;
    }

    const priority = prioritySelect.value;
    const dueDate = dueDateInput.value;

    if (editingId !== null) {
      tasks = tasks.map(task =>
        task.id === editingId
          ? { ...task, text, priority, dueDate }
          : task
      );

      editingId = null;
      addTaskBtn.textContent = "Agregar";
    } else {
      tasks.push({
        id: Date.now(),
        text,
        completed: false,
        priority,
        dueDate
      });
    }

    taskInput.value = "";
    prioritySelect.value = "media";
    dueDateInput.value = "";

    saveTasks();
    renderTasks();
  }

  function editTask(id) {
    const task = tasks.find(task => task.id === id);

    if (!task) return;

    taskInput.value = task.text;
    prioritySelect.value = task.priority;
    dueDateInput.value = task.dueDate || "";

    editingId = id;
    addTaskBtn.textContent = "Guardar";
    taskInput.focus();
  }

  function toggleTask(id) {
    tasks = tasks.map(task =>
      task.id === id
        ? { ...task, completed: !task.completed }
        : task
    );

    saveTasks();
    renderTasks();
  }

  function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);

    if (editingId === id) {
      cancelEditing();
    }

    saveTasks();
    renderTasks();
  }

  function cancelEditing() {
    editingId = null;
    taskInput.value = "";
    prioritySelect.value = "media";
    dueDateInput.value = "";
    addTaskBtn.textContent = "Agregar";
  }

  function clearCompletedTasks() {
    if (!tasks.some(task => task.completed)) {
      alert("No hay tareas completadas.");
      return;
    }

    if (confirm("¿Eliminar todas las tareas completadas?")) {
      tasks = tasks.filter(task => !task.completed);

      if (editingId !== null && !tasks.some(task => task.id === editingId)) {
        cancelEditing();
      }

      saveTasks();
      renderTasks();
    }
  }

  function updateCounters() {
    totalCount.textContent = tasks.length;

    pendingCount.textContent =
      tasks.filter(task => !task.completed).length;

    overdueCount.textContent =
      tasks.filter(task => isOverdue(task)).length;
  }

  addTaskBtn.addEventListener("click", addOrUpdateTask);

  taskInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      addOrUpdateTask();
    }

    if (event.key === "Escape" && editingId !== null) {
      cancelEditing();
    }
  });

  clearCompletedBtn.addEventListener("click", clearCompletedTasks);
  searchInput.addEventListener("input", renderTasks);
  sortSelect.addEventListener("change", renderTasks);

  filterButtons.forEach(button => {
    button.addEventListener("click", () => {
      filterButtons.forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");
      currentFilter = button.dataset.filter;

      renderTasks();
    });
  });

  renderTasks();
</script>

</body>
</html>
